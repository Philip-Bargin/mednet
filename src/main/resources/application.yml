spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mednet-api
  jpa:
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    connect-retries: 10
    connect-retries-interval: 2s

mednet:
  supabase:
    auth-enabled: ${SUPABASE_AUTH_ENABLED:false}
    url: ${SUPABASE_URL:${SUPERBASE_PROJECT_URL:}}
    issuer-uri: ${SUPABASE_ISSUER_URI:}
    jwk-set-uri: ${SUPABASE_JWK_SET_URI:}
    secret-key: ${SUPABASE_SECRET_KEY:}
  admin:
    email: ${MEDNET_ADMIN_EMAIL:}
    password: ${MEDNET_ADMIN_PASSWORD:}
  google:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}
  session:
    # Signed-in sessions end this long after sign-in even when active (0 disables).
    absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}
  rate-limit:
    enabled: ${MEDNET_RATE_LIMIT_ENABLED:true}
    # Reverse proxies (addresses or CIDR ranges) whose X-Forwarded-For identifies the client.
    trusted-proxies: ${MEDNET_TRUSTED_PROXIES:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    url: /api-docs/
    operations-sorter: alpha
    tags-sorter: alpha

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      # Idle timeout: a session unused for this long ends.
      timeout: ${SESSION_IDLE_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
